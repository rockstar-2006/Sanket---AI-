<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgSanket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Ribbon (Gesture / Hand Arc) Orange to Amber -->
    <linearGradient id="gestureRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Bottom Ribbon (Voice / Speech Arc) Amber to Sunset Red -->
    <linearGradient id="speechRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- AI Nexus Glow (Cyan & Emerald) -->
    <radialGradient id="aiPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Center Flare -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgSanket)" />
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.35" />

  <!-- Ambient Radiant Core -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Outer Sound & Motion Echo Arcs -->
  <g opacity="0.35">
    <path d="M 370 170 A 150 150 0 0 1 410 256 A 150 150 0 0 1 370 342" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12" />
    <path d="M 142 170 A 150 150 0 0 0 102 256 A 150 150 0 0 0 142 342" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12" />
  </g>

  <!-- Main "S" Emblem (Sign + Speech Infinity Ribbon) -->
  <g filter="url(#shadowS)">
    
    <!-- Upper Loop: Hand / Gesture Curve (Flowing smoothly into the center nexus) -->
    <path d="M 180 190 
             C 180 135, 230 110, 290 110 
             C 360 110, 395 155, 375 210 
             C 355 260, 285 270, 240 285 
             C 195 300, 155 330, 150 375 
             C 145 405, 160 415, 175 410" 
          fill="none" 
          stroke="url(#gestureRibbon)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Stylized Gesture Fingertip Nodes (Representing ISL Sign Points) -->
    <g transform="translate(180, 190)">
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="8" fill="#F97316" />
    </g>

    <!-- Lower Loop: Speech / Wave Curve (Flowing back through the nexus) -->
    <path d="M 332 322 
             C 332 377, 282 402, 222 402 
             C 152 402, 117 357, 137 302 
             C 157 252, 227 242, 272 227 
             C 317 212, 357 182, 362 137 
             C 367 107, 352 97, 337 102" 
          fill="none" 
          stroke="url(#speechRibbon)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.95" />

    <!-- Stylized Audio Wave Pulse Tip -->
    <g transform="translate(332, 322)">
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="8" fill="#F59E0B" />
    </g>

    <!-- Center AI Translation Nexus (The Radiant Bridge Point) -->
    <g transform="translate(256, 256)">
      <!-- AI Glow Halo -->
      <circle cx="0" cy="0" r="42" fill="url(#aiPulse)" />
      
      <!-- Core Nexus Diamond / Sparkle -->
      <path d="M 0 -22 L 7 -7 L 22 0 L 7 7 L 0 22 L -7 7 L -22 0 L -7 -7 Z" fill="#FFFFFF" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="5" fill="#06B6D4" />
    </g>
  </g>

  <!-- Speech Audio Frequencies (3 Dynamic Sound Wave Bars on Right) -->
  <g transform="translate(390, 236)" fill="#FBBF24" opacity="0.9">
    <rect x="0" y="8" width="6" height="24" rx="3" />
    <rect x="14" y="0" width="6" height="40" rx="3" fill="#F97316" />
    <rect x="28" y="12" width="6" height="16" rx="3" />
  </g>

  <!-- Gesture Spatial Nodes (3 Visual Tracking Points on Left) -->
  <g transform="translate(90, 240)">
    <circle cx="0" cy="4" r="5" fill="#38BDF8" opacity="0.8" />
    <circle cx="16" cy="16" r="6" fill="#06B6D4" />
    <circle cx="4" cy="30" r="4" fill="#38BDF8" opacity="0.6" />
    <!-- Connecting neural line -->
    <path d="M 0 4 L 16 16 L 4 30" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.5" />
  </g>
</svg>
