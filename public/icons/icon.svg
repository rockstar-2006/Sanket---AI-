<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Glowing Radial Accent in Center -->
  <circle cx="256" cy="240" r="160" fill="url(#cyanGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Main Camera Body Container -->
  <rect x="116" y="140" width="210" height="170" rx="36" fill="#1e293b" stroke="#475569" stroke-width="6" />

  <!-- Video Camera Lens Cones -->
  <path d="M 336 195 L 406 148 C 418 140 430 148 430 162 L 430 288 C 430 302 418 310 406 302 L 336 255 Z" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Stylized Indian Sign Language (Hand Silhouette) inside Camera Frame -->
  <g transform="translate(148, 165) scale(0.68)" fill="#ffffff">
    <!-- Palm & Wrist -->
    <path d="M 60 170 C 60 210, 110 210, 110 170 L 110 110 C 110 100, 95 100, 95 110 L 95 70 C 95 58, 80 58, 80 70 L 80 50 C 80 38, 65 38, 65 50 L 65 65 C 65 53, 50 53, 50 65 L 50 140 C 35 130, 20 145, 35 158 Z" />
    <!-- Pulse Sparkle Badge -->
    <circle cx="170" cy="50" r="14" fill="#38bdf8" />
  </g>

  <!-- Sound / Translation Wave Pill at Bottom -->
  <rect x="136" y="345" width="240" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" />
  <circle cx="168" cy="366" r="6" fill="#fb923c" />
  <rect x="188" y="361" width="36" height="10" rx="5" fill="#38bdf8" />
  <rect x="234" y="357" width="48" height="18" rx="9" fill="#10b981" />
  <rect x="292" y="361" width="32" height="10" rx="5" fill="#38bdf8" />
  <circle cx="344" cy="366" r="6" fill="#fb923c" />

  <!-- App Name Label Pill -->
  <text x="256" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#f8fafc" letter-spacing="1">
    SANKET<tspan fill="#f97316">.AI</tspan>
  </text>
</svg>
